<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#0f1a2e"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ba0ff"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3d44"/>
      <stop offset="1" stop-color="#2a2d34"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- road -->
  <rect x="136" y="40" width="240" height="432" rx="24" fill="url(#road)"/>
  <!-- road edges -->
  <rect x="128" y="40" width="10" height="432" rx="4" fill="#d4d4d4"/>
  <rect x="374" y="40" width="10" height="432" rx="4" fill="#d4d4d4"/>
  <!-- lane dashes -->
  <g fill="#fff" opacity="0.85">
    <rect x="253" y="60" width="6" height="50" rx="3"/>
    <rect x="253" y="140" width="6" height="50" rx="3"/>
    <rect x="253" y="220" width="6" height="50" rx="3"/>
    <rect x="253" y="300" width="6" height="50" rx="3"/>
    <rect x="253" y="380" width="6" height="50" rx="3"/>
  </g>
  <!-- enemy car (red, top) -->
  <g>
    <rect x="180" y="70" width="68" height="100" rx="14" fill="#e23b3b"/>
    <rect x="190" y="84" width="48" height="20" rx="4" fill="#14202e" opacity="0.85"/>
    <rect x="186" y="72" width="10" height="6" rx="2" fill="#ff5a5a"/>
    <rect x="232" y="72" width="10" height="6" rx="2" fill="#ff5a5a"/>
    <rect x="186" y="162" width="10" height="6" rx="2" fill="#ffd966"/>
    <rect x="232" y="162" width="10" height="6" rx="2" fill="#ffd966"/>
  </g>
  <!-- player car (blue, bottom) -->
  <g>
    <rect x="264" y="330" width="68" height="100" rx="14" fill="url(#car)"/>
    <rect x="274" y="344" width="48" height="20" rx="4" fill="#14202e" opacity="0.85"/>
    <rect x="270" y="332" width="10" height="6" rx="2" fill="#ffe08a"/>
    <rect x="316" y="332" width="10" height="6" rx="2" fill="#ffe08a"/>
    <rect x="270" y="422" width="10" height="6" rx="2" fill="#ff4d4d"/>
    <rect x="316" y="422" width="10" height="6" rx="2" fill="#ff4d4d"/>
    <!-- wheels -->
    <rect x="259" y="346" width="6" height="22" rx="2" fill="#15171c"/>
    <rect x="331" y="346" width="6" height="22" rx="2" fill="#15171c"/>
    <rect x="259" y="394" width="6" height="22" rx="2" fill="#15171c"/>
    <rect x="331" y="394" width="6" height="22" rx="2" fill="#15171c"/>
  </g>
</svg>
